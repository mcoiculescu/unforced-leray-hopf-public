name = "UnforcedLeray"
version = "0.1.0"
defaultTargets = ["UnforcedLeray"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "85e3a25e006c35636f0e53b0e9296caca2685bc0"

[[lean_lib]]
name = "UnforcedLeray"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
globs = ["UnforcedLeray", "UnforcedLeray.+"]

[[lean_lib]]
name = "NonUniqueEuler"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
globs = ["NonUniqueEuler.+"]

[[lean_lib]]
name = "NavierStokes"
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
globs = ["NavierStokes.+"]
